kind = "mobile"
previewPath = "/"
title = "Revenue Sharing App"
version = "1.0.0"
id = "artifacts/revenue-sharing"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25554

[services.development]
run = "pnpm --filter @workspace/revenue-sharing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/revenue-sharing", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/revenue-sharing", "run", "serve" ]

[services.env]
PORT = "25554"
BASE_PATH = "/"
